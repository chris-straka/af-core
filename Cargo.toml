[package]
name = "af-core"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Engine-agnostic deterministic game-audio DSP, ITU-R BS.1770-4 loudness, and wordless formant voice synthesis"
repository = "https://github.com/chris-straka/af-core"

[features]
default = ["kira"]
kira = ["dep:kira"]

[dependencies]
kira = { version = "=0.12.5", default-features = false, features = ["wav", "pcm", "ogg", "vorbis", "flac", "mp3", "cpal"], optional = true }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
